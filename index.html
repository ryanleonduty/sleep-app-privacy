<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sleep companion app</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; background: #fbf4ea; color: #2c241d; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    main { width: min(680px, 100%); background: #fffaf4; border: 1px solid #eadaca; border-radius: 24px; padding: clamp(28px, 6vw, 56px); box-shadow: 0 16px 50px rgba(73, 46, 23, .08); }
    h1 { margin: 0 0 12px; font-size: clamp(30px, 6vw, 48px); letter-spacing: -.04em; }
    p { color: #6b5c4f; line-height: 1.65; }
    nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    a { color: #9b531d; font-weight: 650; }
    .button { display: inline-block; padding: 12px 16px; border-radius: 999px; background: #f2a45e; color: #2c241d; text-decoration: none; }
    footer { margin-top: 36px; font-size: 13px; color: #8e7d6e; }
  </style>
</head>
<body>
  <main>
    <h1>Sleep companion app</h1>
    <p>This is the public privacy and support site for the sleep companion application currently developed by Ryan Le.</p>
    <nav>
      <a class="button" href="privacy/">Privacy policy</a>
      <a href="support/">Support</a>
    </nav>
    <footer>The public product name may change before release. The policy URL is intentionally kept stable.</footer>
  </main>
</body>
</html>
